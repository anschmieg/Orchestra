name: Independent exact-original post-receipt rotation GREEN
on:
  push:
    branches: [verification/orchestra-20261109-rotation-green]
permissions:
  contents: read
jobs:
  rotation-green:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      SOURCE_SHA: e5408addb1645f5f068dce163f47cfd8c90747ef
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONPATH: codex/scripts:codex/tests
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: e5408addb1645f5f068dce163f47cfd8c90747ef
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: verification/orchestra-20261109-rotation-green
          persist-credentials: false
          path: review_only_checkout
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      - name: Install pinned cryptographic dependency
        run: python3 -m pip install --disable-pip-version-check 'cryptography==46.0.3'
      - name: Assert exact original source and changed blob identity
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git rev-parse HEAD:codex/scripts/acceptance_cli.py)" = "b88a6f74076132fdb8873f3ee6b06c9284de19d9"
          test "$(git rev-parse HEAD:codex/scripts/acceptance_broker_ipc.py)" = "e0a1e95f30977ac95bc7c8f902796d365d2e9bca"
          test "$(git rev-parse HEAD:codex/tests/test_acceptance_rotation.py)" = "a7dffe1ee47728b2f4a9bfad28e518bd7f939b9c"
          echo "EXACT_ORIGINAL_SOURCE=$SOURCE_SHA"
      - name: Targeted six in-flight race adversarial regression tests
        run: python3 -m unittest discover -s codex/tests -p test_acceptance_rotation.py -v
      - name: Independent four new second-review adversarial negatives
        if: always()
        run: python3 -m unittest discover -s review_only_checkout/review-only -p test_rotation_second_review.py -v
      - name: Broad original acceptance security suite
        if: always()
        run: python3 -m unittest discover -s codex/tests -p 'test_acceptance_*.py' -v
      - name: Official full conformance
        if: always()
        run: python3 codex/scripts/validate_suite.py --full --comment-base d92a6d360b35147eb480ab9b76e4ac9ec121fe27
