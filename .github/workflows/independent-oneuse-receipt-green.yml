name: Independent exact-original one-use admission receipt GREEN
on:
  push:
    branches: [verification/orchestra-20261109-oneuse-receipt-green]
permissions:
  contents: read
jobs:
  independent-oneuse:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      SOURCE_SHA: 022daa1cce8b892b283e95400febf6d0c416d673
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONPATH: codex/scripts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: 022daa1cce8b892b283e95400febf6d0c416d673
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.11'
      - name: Install pinned cryptographic dependency
        run: python3 -m pip install --disable-pip-version-check 'cryptography==46.0.3'
      - name: Assert pinned ORIGINAL feature source and receipt blob
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git rev-parse HEAD:codex/scripts/acceptance_receipt.py)" = "271859d2d9d2853dd39b5ca389447a1eda3f561a"
          echo "EXACT_ORIGINAL_SOURCE=$SOURCE_SHA"
      - name: Targeted signed receipt and SIGKILL one-use regressions
        run: python3 -m unittest discover -s codex/tests -p 'test_acceptance_signed_receipt.py' -v
      - name: Independent adversarial second security review
        if: always()
        run: python3 -m unittest discover -s codex/tests -p 'test_acceptance_receipt_second_review.py' -v
      - name: Broad acceptance and process-tree security regressions
        if: always()
        run: python3 -m unittest discover -s codex/tests -p 'test_acceptance_*.py' -v
      - name: Official full conformance
        if: always()
        run: python3 codex/scripts/validate_suite.py --full --comment-base d92a6d360b35147eb480ab9b76e4ac9ec121fe27
