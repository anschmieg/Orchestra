name: Independent pinned-original live signed broker receipt GREEN
on:
  push:
    branches: [verification/orchestra-20261109-ipc-receipt-green]
permissions:
  contents: read
jobs:
  independent-ipc-green:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      SOURCE_SHA: 8abf7778d5a8c27d418c4c7f194229cf0c767c9e
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONPATH: codex/scripts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 8abf7778d5a8c27d418c4c7f194229cf0c767c9e
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: verification/orchestra-20261109-ipc-receipt-green
          persist-credentials: false
          path: review_only_checkout
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      - name: Install pinned cryptographic dependency
        run: python3 -m pip install --disable-pip-version-check 'cryptography==46.0.3'
      - name: Assert exact ORIGINAL feature source and IPC/receipt blobs
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git rev-parse HEAD:codex/scripts/acceptance_broker_ipc.py)" = "27a14e1f9b6b66cabcb364ca53b7b5480cf322a7"
          test "$(git rev-parse HEAD:codex/scripts/acceptance_receipt.py)" = "6d53270d04b1627433a231b1d98e542762baf0ef"
          echo "EXACT_ORIGINAL_SOURCE=$SOURCE_SHA"
      - name: New live IPC signed receipt adversarial targeted GREEN
        run: python3 -m unittest discover -s codex/tests -p 'test_acceptance_ipc_receipt_binding.py' -v
      - name: Independent adversarial second security review, simulated broker never GO
        if: always()
        run: python3 -m unittest discover -s review_only_checkout/review-only -p 'test_acceptance_ipc_receipt_second_review.py' -v
      - name: Broad source acceptance and process-tree security regressions
        if: always()
        run: python3 -m unittest discover -s codex/tests -p 'test_acceptance_*.py' -v
      - name: Full official conformance
        if: always()
        run: python3 codex/scripts/validate_suite.py --full --comment-base d92a6d360b35147eb480ab9b76e4ac9ec121fe27
