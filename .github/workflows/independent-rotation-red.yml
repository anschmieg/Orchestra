name: Independent exact-original in-flight rotation RED
on:
  push:
    branches: [verification/orchestra-20261109-rotation-red]
permissions:
  contents: read
jobs:
  rotation-red:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      SOURCE_SHA: e5580b7178958ac717ca7a32dc6a834ca79692e2
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONPATH: codex/scripts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: e5580b7178958ac717ca7a32dc6a834ca79692e2
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: verification/orchestra-20261109-rotation-red
          persist-credentials: false
          path: review_only_checkout
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      - run: python3 -m pip install --disable-pip-version-check 'cryptography==46.0.3'
      - name: Assert immutable exact original code
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git rev-parse HEAD:codex/scripts/acceptance_cli.py)" = "548d3137049a5609778c691ef773ef4e0fe52b6a"
          echo "EXACT_ORIGINAL_SOURCE=$SOURCE_SHA"
      - name: Six new post-receipt installation race adversarial negatives RED
        run: python3 -m unittest discover -s review_only_checkout/review-only -p test_acceptance_rotation.py -v
