name: Independent verifier trust boundary RED
on:
  push:
    branches:
      - verification/orchestra-20261109-verifier-trust-red

permissions:
  contents: read

jobs:
  adversarial-red:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      SOURCE_SHA: 5a35bf79d2677a3f8eac2b52165201a18b1aa309
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify unchanged pinned original implementation
        run: |
          set -euo pipefail
          git diff --quiet "$SOURCE_SHA" HEAD -- codex/scripts/acceptance_cli.py
          test "$(git rev-parse HEAD~2)" = "$SOURCE_SHA"
          printf "BASELINE_ORIGINAL_SOURCE=%s\n" "$SOURCE_SHA"
      - name: Test-first RED proof
        run: |
          set +e
          python3 -m unittest discover -s codex/tests -p test_acceptance_verifier_trust_boundary.py -v
          rc=$?
          set -e
          printf 'RED_COMMAND=python3 -m unittest discover -s codex/tests -p test_acceptance_verifier_trust_boundary.py -v EXIT=%s EXPECT=1\n' "$rc"
          test "$rc" -eq 1
