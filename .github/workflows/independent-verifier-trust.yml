name: Independent exact-source verifier trust boundary
on:
  push:
    branches:
      - verification/orchestra-20261109-verifier-trust-green

permissions:
  contents: read

jobs:
  exact-source-acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      SOURCE_SHA: adee51b70739646d7384062bf7af2536cf3908de
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: adee51b70739646d7384062bf7af2536cf3908de
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.11'
      - name: Install test cryptography dependency
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check 'cryptography==46.0.3'
      - name: Pin original feature source exactly
        run: |
          set -euo pipefail
          printf 'EXACT_FEATURE_SOURCE=%s\n' "$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - name: Targeted verifier and IPC boundary regressions
        run: |
          set -euo pipefail
          for file in test_acceptance_verifier_trust_boundary.py test_acceptance_cli_adversarial.py test_acceptance_os_principal.py test_acceptance_keyring.py test_acceptance_broker_ipc.py test_acceptance_atomic_peer_identity.py; do
            python3 -m unittest discover -s codex/tests -p "$file" -v
            printf 'TARGETED_COMMAND=python3 -m unittest discover -s codex/tests -p %s -v EXIT=0\n' "$file"
          done
      - name: Official full conformance
        run: |
          set +e
          python3 codex/scripts/validate_suite.py --full --comment-base 85c65b4f05b58a6936d52cfcbad3446730125834
          rc=$?
          printf 'OFFICIAL_COMMAND=python3 codex/scripts/validate_suite.py --full --comment-base 85c65b4f05b58a6936d52cfcbad3446730125834 EXIT=%s\n' "$rc"
          exit "$rc"
      - name: Broad adversarial acceptance suite
        if: always()
        run: |
          set +e
          python3 -m unittest discover -s codex/tests -p 'test_acceptance_*.py' -v
          rc=$?
          printf "ADVERSARIAL_COMMAND=python3 -m unittest discover -s codex/tests -p 'test_acceptance_*.py' -v EXIT=%s\n" "$rc"
          exit "$rc"
